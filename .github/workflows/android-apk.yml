name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"

jobs:
  build-apk:
    name: Build APK instalavel
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias
        run: npm install

      - name: Gerar icones e splash validos
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          BLUE = "#1463FF"
          GREEN = "#16845B"
          WHITE = "#FFFFFF"
          BG = "#F7F8FA"
          assets = Path("assets")
          assets.mkdir(exist_ok=True)

          def draw_mark(image, box, with_blue_bg=False):
              draw = ImageDraw.Draw(image)
              x0, y0, x1, y1 = box
              w, h = x1 - x0, y1 - y0
              if with_blue_bg:
                  draw.rectangle(box, fill=BLUE)

              cx = x0 + w * 0.50
              top = y0 + h * 0.19
              helmet_left = x0 + w * 0.20
              helmet_right = x0 + w * 0.80
              helmet_bottom = y0 + h * 0.50

              # Capacete
              draw.pieslice(
                  [helmet_left, top, helmet_right, y0 + h * 0.67],
                  start=180, end=360, fill=WHITE
              )
              draw.rectangle(
                  [x0 + w * 0.17, y0 + h * 0.43, x0 + w * 0.83, helmet_bottom],
                  fill=WHITE
              )
              draw.rounded_rectangle(
                  [x0 + w * 0.47, y0 + h * 0.15, x0 + w * 0.53, y0 + h * 0.39],
                  radius=max(2, int(w * 0.015)), fill=WHITE
              )

              # Oculos de protecao
              stroke = max(3, int(w * 0.035))
              draw.rounded_rectangle(
                  [x0 + w * 0.24, y0 + h * 0.51, x0 + w * 0.76, y0 + h * 0.69],
                  radius=max(4, int(w * 0.055)), outline=WHITE, width=stroke
              )
              draw.line(
                  [x0 + w * 0.18, y0 + h * 0.58, x0 + w * 0.24, y0 + h * 0.58],
                  fill=WHITE, width=stroke
              )
              draw.line(
                  [x0 + w * 0.76, y0 + h * 0.58, x0 + w * 0.82, y0 + h * 0.58],
                  fill=WHITE, width=stroke
              )

              # Escudo de conformidade
              shield = [
                  (x0 + w * 0.64, y0 + h * 0.62),
                  (x0 + w * 0.82, y0 + h * 0.56),
                  (x0 + w * 0.88, y0 + h * 0.64),
                  (x0 + w * 0.86, y0 + h * 0.82),
                  (x0 + w * 0.76, y0 + h * 0.90),
                  (x0 + w * 0.66, y0 + h * 0.82),
              ]
              draw.polygon(shield, fill=GREEN, outline=WHITE)
              check_w = max(3, int(w * 0.026))
              draw.line(
                  [x0 + w * 0.70, y0 + h * 0.74, x0 + w * 0.75, y0 + h * 0.79,
                   x0 + w * 0.83, y0 + h * 0.68],
                  fill=WHITE, width=check_w, joint="curve"
              )

          # Icone quadrado, sem texto e sem cantos arredondados
          icon = Image.new("RGBA", (1024, 1024), BLUE)
          draw_mark(icon, (90, 90, 934, 934), with_blue_bg=False)
          icon.save(assets / "icon.png", "PNG", optimize=False, compress_level=6)

          # Foreground do adaptive icon: fundo transparente
          adaptive = Image.new("RGBA", (1024, 1024), (0, 0, 0, 0))
          draw_mark(adaptive, (170, 170, 854, 854), with_blue_bg=False)
          adaptive.save(assets / "adaptive-icon.png", "PNG", optimize=False, compress_level=6)

          # Splash: marca centralizada sobre fundo transparente; app.json fornece #F7F8FA
          splash = Image.new("RGBA", (1024, 1024), (0, 0, 0, 0))
          draw = ImageDraw.Draw(splash)
          draw.rectangle((252, 252, 772, 772), fill=BLUE)
          draw_mark(splash, (292, 292, 732, 732), with_blue_bg=False)
          splash.save(assets / "splash.png", "PNG", optimize=False, compress_level=6)

          # Favicon
          favicon = icon.resize((64, 64), Image.Resampling.LANCZOS)
          favicon.save(assets / "favicon.png", "PNG", optimize=False, compress_level=6)

          for name in ["icon.png", "adaptive-icon.png", "splash.png", "favicon.png"]:
              print(f"Asset gerado: {assets / name}")
          PY

      - name: Verificar lint TypeScript e testes
        run: npm run check

      - name: Gerar projeto Android nativo
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean

      - name: Compilar APK de teste
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ATC-Controle-EPI.apk

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: ATC-Controle-EPI-APK
          path: ATC-Controle-EPI.apk
          if-no-files-found: error
          retention-days: 30
