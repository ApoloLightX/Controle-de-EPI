name: Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "audit/**"
    paths-ignore:
      - "README.md"

jobs:
  validate:
    name: TypeScript, lint e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Verificar TypeScript lint e testes
        run: npm run check

  build-apk:
    name: Build APK Release standalone
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Restaurar assinatura Android conhecida
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: atc-controle-epi-debug-keystore-v1

      - name: Verificar assinatura compativel com instalacoes existentes
        env:
          ATC_ANDROID_KEYSTORE_BASE64: ${{ secrets.ATC_ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ] && [ -n "${ATC_ANDROID_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$ATC_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          fi

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            echo "::error::Chave Android conhecida indisponivel. Build abortada para evitar gerar um APK com assinatura diferente e quebrar a atualizacao do app instalado."
            echo "Restaure a chave original no cache ou configure ATC_ANDROID_KEYSTORE_BASE64 com exatamente o mesmo keystore usado nas builds anteriores."
            exit 1
          fi

          keytool -list \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey >/dev/null

          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            | grep -E "SHA256:|SHA-256:" || true

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Gerar icones e splash validos
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          BLUE = "#1463FF"
          GREEN = "#16845B"
          WHITE = "#FFFFFF"
          assets = Path("assets")
          assets.mkdir(exist_ok=True)

          def draw_mark(image, box, with_blue_bg=False):
              draw = ImageDraw.Draw(image)
              x0, y0, x1, y1 = box
              w, h = x1 - x0, y1 - y0
              if with_blue_bg:
                  draw.rectangle(box, fill=BLUE)

              top = y0 + h * 0.19
              helmet_left = x0 + w * 0.20
              helmet_right = x0 + w * 0.80
              helmet_bottom = y0 + h * 0.50

              draw.pieslice(
                  [helmet_left, top, helmet_right, y0 + h * 0.67],
                  start=180, end=360, fill=WHITE
              )
              draw.rectangle(
                  [x0 + w * 0.17, y0 + h * 0.43, x0 + w * 0.83, helmet_bottom],
                  fill=WHITE
              )
              draw.rounded_rectangle(
                  [x0 + w * 0.47, y0 + h * 0.15, x0 + w * 0.53, y0 + h * 0.39],
                  radius=max(2, int(w * 0.015)), fill=WHITE
              )

              stroke = max(3, int(w * 0.035))
              draw.rounded_rectangle(
                  [x0 + w * 0.24, y0 + h * 0.51, x0 + w * 0.76, y0 + h * 0.69],
                  radius=max(4, int(w * 0.055)), outline=WHITE, width=stroke
              )
              draw.line(
                  [x0 + w * 0.18, y0 + h * 0.58, x0 + w * 0.24, y0 + h * 0.58],
                  fill=WHITE, width=stroke
              )
              draw.line(
                  [x0 + w * 0.76, y0 + h * 0.58, x0 + w * 0.82, y0 + h * 0.58],
                  fill=WHITE, width=stroke
              )

              shield = [
                  (x0 + w * 0.64, y0 + h * 0.62),
                  (x0 + w * 0.82, y0 + h * 0.56),
                  (x0 + w * 0.88, y0 + h * 0.64),
                  (x0 + w * 0.86, y0 + h * 0.82),
                  (x0 + w * 0.76, y0 + h * 0.90),
                  (x0 + w * 0.66, y0 + h * 0.82),
              ]
              draw.polygon(shield, fill=GREEN, outline=WHITE)
              check_w = max(3, int(w * 0.026))
              draw.line(
                  [x0 + w * 0.70, y0 + h * 0.74, x0 + w * 0.75, y0 + h * 0.79,
                   x0 + w * 0.83, y0 + h * 0.68],
                  fill=WHITE, width=check_w, joint="curve"
              )

          icon = Image.new("RGBA", (1024, 1024), BLUE)
          draw_mark(icon, (90, 90, 934, 934))
          icon.save(assets / "icon.png", "PNG", optimize=False, compress_level=6)

          adaptive = Image.new("RGBA", (1024, 1024), (0, 0, 0, 0))
          draw_mark(adaptive, (170, 170, 854, 854))
          adaptive.save(assets / "adaptive-icon.png", "PNG", optimize=False, compress_level=6)

          splash = Image.new("RGBA", (1024, 1024), (0, 0, 0, 0))
          draw = ImageDraw.Draw(splash)
          draw.rectangle((252, 252, 772, 772), fill=BLUE)
          draw_mark(splash, (292, 292, 732, 732))
          splash.save(assets / "splash.png", "PNG", optimize=False, compress_level=6)

          favicon = icon.resize((64, 64), Image.Resampling.LANCZOS)
          favicon.save(assets / "favicon.png", "PNG", optimize=False, compress_level=6)

          for name in ["icon.png", "adaptive-icon.png", "splash.png", "favicon.png"]:
              print(f"Asset gerado: {assets / name}")
          PY

      - name: Verificar TypeScript lint e testes
        run: npm run check

      - name: Gerar projeto Android nativo
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean

      - name: Preparar APK como atualizacao do app instalado
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()
          version_code = os.environ["VERSION_CODE"]
          updated, count = re.subn(r"versionCode\s+\d+", f"versionCode {version_code}", text, count=1)
          if count != 1:
              raise SystemExit("Nao foi possivel atualizar versionCode")
          path.write_text(updated)
          print(f"versionCode Android definido como {version_code}")
          PY

      - name: Compilar APK Release standalone com JavaScript embutido
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ATC-Controle-EPI.apk

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: ATC-Controle-EPI-APK
          path: ATC-Controle-EPI.apk
          if-no-files-found: error
          retention-days: 30
