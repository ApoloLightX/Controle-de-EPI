name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"

jobs:
  build-apk:
    name: Build APK instalavel
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias
        run: npm install

      - name: Normalizar imagens PNG
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          for name in ["icon.png", "adaptive-icon.png", "splash.png", "favicon.png"]:
              path = Path("assets") / name
              with Image.open(path) as image:
                  normalized = image.convert("RGBA")
                  normalized.save(path, format="PNG", optimize=False, compress_level=6)
                  print(f"PNG normalizado: {path}")
          PY

      - name: Verificar lint TypeScript e testes
        run: npm run check

      - name: Gerar projeto Android nativo
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean

      - name: Compilar APK de teste
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ATC-Controle-EPI.apk

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: ATC-Controle-EPI-APK
          path: ATC-Controle-EPI.apk
          if-no-files-found: error
          retention-days: 30
